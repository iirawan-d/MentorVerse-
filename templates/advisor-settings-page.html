<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Advisor Settings</title>
  <meta name="description" content="Advisor account settings - manage your profile information, credentials, and preferences." />
  <link rel="stylesheet" href="{{ url_for('static', filename='advisor-settings-page.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='student-dashboard-page.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='advisor-dashboard.css') }}">

</head>
<body>


      <!-- Top Navbar -->
      <header class="adv-topbar">
        <div class="adv-topbar-left">
        <div class="brand-icon"><i class="fa-solid fa-graduation-cap"></i></div>
        <div class="brand-text">
          <h2>MentorVerse</h2>
          <p>ACADEMIC PORTAL</p>
        </div>
        </div>
        <div class="adv-topbar-right">
          <a href="{{ url_for('logout') }}">
          <button class="adv-icon-btn" id="notif-btn"><i class="fa-solid fa-right-from-bracket"></i></button>
          </a>
          <div class="adv-user-box">
            <div class="adv-user-info">
              <h4>{{ user.Fname }} {{ user.Lname }}</h4>
              <p>ID: {{ user.university_id }}</p>
            </div>
            <div class="adv-user-avatar">
              <i class="fa-solid fa-user"></i>
            </div>
          </div>
        </div>
      </header>




  <div class="as-shell">

    <!-- Sidebar -->
    <aside class="sidebar">

      <nav class="side-nav">
        <a href="/advisor-students-list-page" class="adv-nav-item"><i class="fa-solid fa-table-cells-large"></i><span>Student List</span></a>
        <a href="/advisor-notification-page" class="adv-nav-item"><i class="fa-solid fa-bell"></i><span>Notifications</span></a>
        <a href="/advisor-settings-page" class="nav-item active"><i class="fa-solid fa-gear"></i><span>Settings</span></a>
      </nav>
    </aside>

    <!-- Main -->
    <main class="as-main">

      <!-- Page Head -->
      <div class="as-page-head">
        <p class="as-eyebrow">ADVISOR CONTROL PANEL</p>
        <h1 class="as-page-title">Account Settings</h1>
      </div>

      <!-- Advisor Profile Card -->
    <form method="POST" action="{{ url_for('advisor_settings_page') }}">
      <div class="as-card">
        <h2 class="as-card-title">
          <i class="fa-solid fa-user-pen as-card-title-icon"></i> Advisor Profile
        </h2>

        <div class="as-form-grid">
          <div class="as-field">
            <label for="first-name">FIRST NAME</label>
            <input type="text" id="first-name" name="first_name" value="{{ user.Fname }}" />
          </div>

          <div class="as-field">
            <label for="last-name">LAST NAME</label>
            <input type="text" id="last-name" name="last_name" value="{{ user.Lname }}" />
          </div>

          <div class="as-field full">
            <label for="department">DEPARTMENT</label>
              <select id="department" name="department">
                <option selected>{{ user.department }}</option>
                <option>Computer Science</option>
                <option>Mechanical Engineering</option>
                <option>Business Analytics</option>
                <option>Architecture</option>
                <option>Mathematics</option>
              </select>
          </div>

          <div class="as-field full">
            <label for="bio">BIO</label>
            <textarea id="bio" name="bio">{{ user.bio }}</textarea>
          </div>

          <div class="as-field full">
            <label for="office-location">OFFICE LOCATION</label>
            <input type="text" id="office-location" name="office" value="{{ user.office }}" />
          </div>
        </div>

        <div class="as-btn-row">
          <button type="submit" class="as-btn-primary" id="update-profile-btn">Update Advisor Profile</button>
        </div>
      </div>
      </form>

    </main>

  </div>
  

  <!-- Footer -->
  <footer class="as-footer">
    <div class="as-footer-inner">
      <div class="as-footer-left">
        <div class="as-footer-brand">MentorVerse</div>
        <p>&copy; 2026 MENTORVERSE.</p>
      </div>
      <div class="as-footer-links">
            <a href="/Home-page">HOME</a>
            <a href="/faq-page">FAQ</a>
            <a href="/contact-us-page">CONTACT US</a>
      </div>
    </div>
  </footer>

</body>
</html>
